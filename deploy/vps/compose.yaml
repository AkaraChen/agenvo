services:
  relay:
    build:
      context: ../..
      dockerfile: deploy/vps/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ./relay.local.json:/config/relay.json:ro
      - ./data:/data
    networks: [relay]
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      AGENVO_DOMAIN: ${AGENVO_DOMAIN:?Set AGENVO_DOMAIN to your public DNS name}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [relay]
networks:
  relay:
volumes:
  caddy_data:
  caddy_config:
